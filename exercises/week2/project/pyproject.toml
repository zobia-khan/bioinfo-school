[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fastq-qc"
version = "0.1.0"
description = "Standalone FASTQ quality-control tool producing a self-contained HTML report"
readme = "README.md"
requires-python = ">=3.8"
# No third-party runtime dependencies — stdlib only
dependencies = []

[project.scripts]
fastq-qc = "fastq_qc:main"

[tool.setuptools.packages.find]
# Keep it simple: the two .py files live at the root of the project directory.
where = ["."]
include = ["fastq_qc*", "generate_mock_fastq*"]
